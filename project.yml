name: RezkaPort
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: $(REZKA_BUNDLE_IDENTIFIER)
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "3"
    INFOPLIST_KEY_CFBundleDisplayName: Rezka
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    exactVersion: 2.14.1
targets:
  RezkaPort:
    type: application
    platform: iOS
    info:
      path: StreamingApp/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RezkaCloudContainer: $(REZKA_ICLOUD_CONTAINER)
        UIBackgroundModes:
          - audio
    sources:
      - path: StreamingApp
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: $(REZKA_ICLOUD_ENTITLEMENTS)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(REZKA_CLOUDKIT_CONDITION)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
      configs:
        Debug:
          REZKA_ICLOUD_ENVIRONMENT: Development
        Release:
          REZKA_ICLOUD_ENVIRONMENT: Production
  RezkaPortTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StreamingAppTests
    dependencies:
      - target: RezkaPort
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(REZKA_BUNDLE_IDENTIFIER).tests
  RezkaPortUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StreamingAppUITests
    dependencies:
      - target: RezkaPort
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(REZKA_BUNDLE_IDENTIFIER).uitests
        TEST_TARGET_NAME: RezkaPort
schemes:
  RezkaPort:
    build:
      targets:
        RezkaPort: all
    test:
      targets:
        - RezkaPortTests
        - RezkaPortUITests
